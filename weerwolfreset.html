<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Hackers versus Burgers</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: linear-gradient(145deg, #141b2d, #1a233a);
            border-radius: 30px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a3a5a;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        button {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff1744, #ff5252);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #status {
            margin-top: 20px;
            font-size: 1rem;
            color: #8899bb;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Reset Spel</h1>
        <p style="color:#8899bb; margin-bottom:20px;">Zet het Firestore-document terug naar de beginstatus.</p>
        <button onclick="resetGame()">Reset nu</button>
        <div id="status"></div>
    </div>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Jouw Firebase config -->
    <script src="firebase-config.js"></script>

    <script>
        // Referentie naar het spel-document
        const gameRef = db.collection('games').doc('currentGame');

        // Beginstatus
        const BEGIN_STATUS = {
            status: 'naaminvoer',
            namen: [],
            rollen: {},
            acties: {},
            afvallers: [],
            stemmen: {},
            stemBeurtIndex: 0,
            isEersteStemmer: true,
            huidigeBeurt: '',
            winnaar: '',
            ronden: 0,
            config: {
                ondervraagTijd: 120,
                stemTijdEerste: 10,
                stemTijdVolgende: 5
            }
        };

        async function resetGame() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Bezig met resetten...';
            try {
                await gameRef.set(BEGIN_STATUS);
                statusEl.textContent = '✅ Spel is gereset! Je kunt nu een nieuw spel starten.';
            } catch (error) {
                console.error('Reset fout:', error);
                statusEl.textContent = '❌ Fout bij resetten: ' + error.message;
            }
        }
    </script>
</body>
</html>
