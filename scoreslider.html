<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorebord - Digibord</title>
    <style>
        /* ===== ALGEMENE STIJL ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: linear-gradient(145deg, #f5f0e7 0%, #e8e0d5 100%);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 60px 60px 40px 40px;
            padding: 40px 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 4px solid #fff;
        }

        h1 {
            text-align: center;
            font-size: 3.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0 #d5c9b8;
            letter-spacing: 3px;
            word-break: break-word;
        }

        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            color: #5d6d7e;
            margin-bottom: 35px;
            font-weight: 600;
        }

        /* ===== INVOERGEBIED ===== */
        .input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 45px;
            background: #ffffffcc;
            padding: 25px 30px;
            border-radius: 50px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            border: 2px dashed #b0a999;
        }

        .input-area label {
            font-size: 1.6rem;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            min-width: 200px;
            padding: 18px 25px;
            font-size: 1.8rem;
            border: 3px solid #bdc3c7;
            border-radius: 40px;
            background: #fff;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 6px #3498db33;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .btn-add {
            background: #2ecc71;
            color: #fff;
            font-size: 2rem;
            padding: 18px 50px;
        }

        .btn-add:hover {
            background: #27ae60;
        }

        /* ===== LEERLINGENLIJST ===== */
        .students-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        /* ===== ÉÉN LEERLING ===== */
        .student-card {
            background: #ffffff;
            border-radius: 40px;
            padding: 18px 28px;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 0 #c9bdb0, 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 2px solid #f0ebe3;
            transition: 0.2s;
        }

        .student-card:hover {
            transform: scale(1.004);
            border-color: #bdc3c7;
        }

        /* ===== VASTE BREEDTE VOOR NAAM ===== */
        .student-name-wrapper {
            min-width: 160px;
            max-width: 160px;
            flex-shrink: 0;
        }

        .student-name {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 8px 16px;
            border-radius: 40px;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            width: 100%;
        }

        /* ===== SCORE CONTROLS (plus/min + getal) ===== */
        .score-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-score {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 2.6rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            line-height: 1;
            flex-shrink: 0;
        }

        .btn-score:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .btn-score:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
            cursor: not-allowed;
        }

        .btn-plus {
            background: #2ecc71;
        }
        .btn-plus:hover:not(:disabled) {
            background: #27ae60;
        }

        .btn-minus {
            background: #e74c3c;
        }
        .btn-minus:hover:not(:disabled) {
            background: #c0392b;
        }

        .score-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            min-width: 60px;
            text-align: center;
            background: #f8f5f0;
            padding: 6px 10px;
            border-radius: 30px;
            border: 2px solid #ddd6cc;
            flex-shrink: 0;
        }

        /* ===== GRAFIEK / BALKWEG ===== */
        .graph-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
            height: 56px;
            background: #ecf0f1;
            border-radius: 40px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.10);
            border: 2px solid #d5cdc0;
            overflow: visible;
        }

        .graph-bar-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 40px;
            overflow: hidden;
        }

        .graph-bar {
            height: 100%;
            width: 50%; /* start op 0 = midden */
            border-radius: 40px;
            transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 12px rgba(52, 152, 219, 0.3);
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        /* Naam in de balk */
        .graph-bar-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        /* Toon de naam in de balk als de balk breed genoeg is */
        .graph-bar:not(.zero) .graph-bar-name {
            opacity: 1;
        }

        /* Kleurverloop op de balk zelf */
        .graph-bar.positive {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            box-shadow: 0 2px 12px rgba(46, 204, 113, 0.4);
        }

        .graph-bar.negative {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            box-shadow: 0 2px 12px rgba(231, 76, 60, 0.4);
        }

        .graph-bar.zero {
            background: #95a5a6;
            box-shadow: 0 2px 12px rgba(149, 165, 166, 0.3);
        }

        /* Labels -20 en +20 op de uiteinden */
        .graph-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #7f8c8d;
            padding: 0 8px;
            margin-top: -20px;
        }

        /* ===== LAADSTATUS ===== */
        .loading {
            text-align: center;
            font-size: 2rem;
            color: #5d6d7e;
            padding: 40px;
            background: #ffffffcc;
            border-radius: 40px;
        }

        .error-message {
            text-align: center;
            font-size: 1.6rem;
            color: #e74c3c;
            padding: 30px;
            background: #ffeaea;
            border-radius: 40px;
            border: 3px solid #e74c3c;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1100px) {
            .student-name-wrapper {
                min-width: 130px;
                max-width: 130px;
            }
            .student-name {
                font-size: 1.6rem;
                padding: 6px 12px;
            }
            .btn-score {
                width: 55px;
                height: 55px;
                font-size: 2.2rem;
            }
            .score-number {
                font-size: 1.8rem;
                min-width: 50px;
            }
            .graph-wrapper {
                height: 48px;
                min-width: 150px;
            }
        }

        @media (max-width: 900px) {
            .container {
                padding: 25px 20px 40px;
            }
            h1 {
                font-size: 2.6rem;
            }
            .student-card {
                padding: 15px 18px;
                flex-wrap: wrap;
                gap: 12px;
            }
            .student-name-wrapper {
                min-width: 100%;
                max-width: 100%;
            }
            .student-name {
                font-size: 1.8rem;
                display: inline-block;
                width: auto;
                padding: 6px 20px;
            }
            .graph-wrapper {
                min-width: 120px;
                height: 44px;
                flex: 1 1 100%;
                order: 10;
            }
            .score-controls {
                flex: 0 1 auto;
            }
        }

        @media (max-width: 600px) {
            .input-area {
                flex-direction: column;
                align-items: stretch;
                padding: 20px;
            }
            .input-area input {
                font-size: 1.4rem;
                padding: 14px 18px;
            }
            .btn {
                font-size: 1.4rem;
                padding: 14px 20px;
            }
            .student-card {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
            }
            .student-name-wrapper {
                min-width: 100%;
                max-width: 100%;
            }
            .student-name {
                font-size: 1.6rem;
            }
            .btn-score {
                width: 50px;
                height: 50px;
                font-size: 2rem;
            }
            .score-number {
                font-size: 1.6rem;
                min-width: 45px;
            }
            .graph-wrapper {
                height: 40px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Scorebord</h1>
    <div class="subtitle">Klik op + of − om de balk te bewegen!</div>

    <!-- ===== INVOER ===== -->
    <div class="input-area">
        <label for="studentNameInput">✏️ Naam:</label>
        <input type="text" id="studentNameInput" placeholder="Bijv. Emma" autofocus>
        <button class="btn btn-add" id="addStudentBtn">➕ Voeg toe</button>
    </div>

    <!-- ===== LIJST MET LEERLINGEN ===== -->
    <div id="studentsContainer" class="students-list">
        <div class="loading">📂 Leerlingen laden...</div>
    </div>
</div>

<script>
    // ============================================================
    //  De applicatie haalt de leerlingen op uit leerlingen.json
    //  Het JSON-bestand moet in dezelfde map staan.
    // ============================================================

    // ---------- Globale variabele ----------
    let students = [];

    // ---------- DOM referenties ----------
    const container = document.getElementById('studentsContainer');
    const nameInput = document.getElementById('studentNameInput');
    const addBtn = document.getElementById('addStudentBtn');

    // ---------- Hulpfunctie: unieke ID ----------
    let nextId = 1;
    function generateId() {
        return nextId++;
    }

    // ---------- Score begrenzing ----------
    const MIN_SCORE = -20;
    const MAX_SCORE = 20;

    // ---------- Kleur voor de balk op basis van score ----------
    function getBarClass(score) {
        if (score > 0) return 'positive';
        if (score < 0) return 'negative';
        return 'zero';
    }

    // ---------- Berekening breedte in % (0 = midden, -20 = 0%, +20 = 100%) ----------
    function scoreToPercent(score) {
        return ((score - MIN_SCORE) / (MAX_SCORE - MIN_SCORE)) * 100;
    }

    // ---------- Een studentkaart renderen ----------
    function renderStudent(student) {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.dataset.id = student.id;

        // ===== NAAM (vaste breedte) =====
        const nameWrapper = document.createElement('div');
        nameWrapper.className = 'student-name-wrapper';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'student-name';
        nameSpan.textContent = student.name;
        nameSpan.title = student.name; // tooltip voor lange namen

        nameWrapper.appendChild(nameSpan);

        // ===== SCORE CONTROLS =====
        const controls = document.createElement('div');
        controls.className = 'score-controls';

        const minusBtn = document.createElement('button');
        minusBtn.className = 'btn-score btn-minus';
        minusBtn.textContent = '−';
        minusBtn.disabled = (student.score <= MIN_SCORE);

        const scoreSpan = document.createElement('span');
        scoreSpan.className = 'score-number';
        scoreSpan.textContent = student.score;

        const plusBtn = document.createElement('button');
        plusBtn.className = 'btn-score btn-plus';
        plusBtn.textContent = '+';
        plusBtn.disabled = (student.score >= MAX_SCORE);

        controls.appendChild(minusBtn);
        controls.appendChild(scoreSpan);
        controls.appendChild(plusBtn);

        // ===== GRAFIEK met NAAM IN DE BALK =====
        const graphWrapper = document.createElement('div');
        graphWrapper.className = 'graph-wrapper';

        const barContainer = document.createElement('div');
        barContainer.className = 'graph-bar-container';

        const bar = document.createElement('div');
        bar.className = `graph-bar ${getBarClass(student.score)}`;
        bar.style.width = scoreToPercent(student.score) + '%';

        // Naam in de balk (zichtbaar als balk breed genoeg is)
        const barName = document.createElement('span');
        barName.className = 'graph-bar-name';
        barName.textContent = student.name;
        bar.appendChild(barName);

        barContainer.appendChild(bar);
        graphWrapper.appendChild(barContainer);

        // Labels -20 en +20
        const labels = document.createElement('div');
        labels.className = 'graph-labels';
        const leftLabel = document.createElement('span');
        leftLabel.textContent = '-20';
        const rightLabel = document.createElement('span');
        rightLabel.textContent = '+20';
        labels.appendChild(leftLabel);
        labels.appendChild(rightLabel);
        graphWrapper.appendChild(labels);

        // Alles in de kaart stoppen
        card.appendChild(nameWrapper);
        card.appendChild(controls);
        card.appendChild(graphWrapper);

        // ---- Event listeners voor + en - ----
        minusBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (student.score > MIN_SCORE) {
                student.score--;
                updateStudentCard(card, student);
            }
        });

        plusBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (student.score < MAX_SCORE) {
                student.score++;
                updateStudentCard(card, student);
            }
        });

        return card;
    }

    // ---------- Een bestaande kaart bijwerken ----------
    function updateStudentCard(card, student) {
        const scoreSpan = card.querySelector('.score-number');
        if (scoreSpan) scoreSpan.textContent = student.score;

        const minusBtn = card.querySelector('.btn-minus');
        const plusBtn = card.querySelector('.btn-plus');
        if (minusBtn) minusBtn.disabled = (student.score <= MIN_SCORE);
        if (plusBtn) plusBtn.disabled = (student.score >= MAX_SCORE);

        const bar = card.querySelector('.graph-bar');
        if (bar) {
            bar.style.width = scoreToPercent(student.score) + '%';
            bar.className = `graph-bar ${getBarClass(student.score)}`;
            
            // Zorg dat de naam in de balk blijft
            let barName = bar.querySelector('.graph-bar-name');
            if (!barName) {
                barName = document.createElement('span');
                barName.className = 'graph-bar-name';
                barName.textContent = student.name;
                bar.appendChild(barName);
            }
        }
    }

    // ---------- Volledige lijst renderen ----------
    function renderAllStudents() {
        container.innerHTML = '';
        if (students.length === 0) {
            container.innerHTML = '<div class="loading">👩‍🎓 Nog geen leerlingen</div>';
            return;
        }
        students.forEach(student => {
            const card = renderStudent(student);
            container.appendChild(card);
        });
    }

    // ---------- Leerling toevoegen (vanuit invoer) ----------
    function addStudentFromInput() {
        const rawName = nameInput.value.trim();
        if (rawName === '') {
            alert('Voer eerst een naam in!');
            nameInput.focus();
            return;
        }

        const newStudent = {
            id: generateId(),
            name: rawName,
            score: 0
        };
        students.push(newStudent);

        const card = renderStudent(newStudent);
        container.appendChild(card);

        nameInput.value = '';
        nameInput.focus();
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ---------- Leerlingen laden uit JSON ----------
    async function loadStudentsFromJson() {
        try {
            const response = await fetch('leerlingen.json');
            if (!response.ok) {
                throw new Error(`HTTP fout! status: ${response.status}`);
            }
            const data = await response.json();
            
            if (!data.leerlingen || !Array.isArray(data.leerlingen)) {
                throw new Error('JSON bevat geen "leerlingen" array');
            }

            students = data.leerlingen.map(leerling => ({
                id: generateId(),
                name: leerling.naam || 'Onbekend',
                score: 0
            }));

            if (data.spellen && Array.isArray(data.spellen)) {
                console.log('📚 Spellen beschikbaar:', data.spellen.join(', '));
            }

            renderAllStudents();
            console.log(`✅ ${students.length} leerlingen geladen uit leerlingen.json`);
            
        } catch (error) {
            console.error('❌ Fout bij laden leerlingen.json:', error);
            container.innerHTML = `
                <div class="error-message">
                    ⚠️ Kon leerlingen.json niet laden.<br>
                    <span style="font-size: 1.2rem; display: block; margin-top: 10px;">
                        Controleer of het bestand in dezelfde map staat.<br>
                        Foutmelding: ${error.message}
                    </span>
                </div>
            `;
        }
    }

    // ---------- Event listeners ----------
    addBtn.addEventListener('click', addStudentFromInput);

    nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addStudentFromInput();
        }
    });

    // ---------- Start de applicatie ----------
    loadStudentsFromJson();
    nameInput.focus();

    console.log('🚀 Scorebord gestart - leerlingen worden geladen uit leerlingen.json');
</script>

</body>
</html>
