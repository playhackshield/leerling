<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorebord - Digibord</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        /* ===== ALGEMENE STIJL ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: linear-gradient(145deg, #f5f0e7 0%, #e8e0d5 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 2000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 30px 30px 20px 20px;
            padding: 20px 25px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 4px solid #fff;
        }

        /* ===== LEERLINGENLIJST ===== */
        .students-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ===== ÉÉN LEERLING (50% kleiner) ===== */
        .student-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 9px 14px;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 #c9bdb0, 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid #f0ebe3;
            transition: 0.2s;
        }

        .student-card:hover {
            transform: scale(1.004);
            border-color: #bdc3c7;
        }

        /* ===== VASTE BREEDTE VOOR NAAM (150px = helft van 300) ===== */
        .student-name-wrapper {
            min-width: 150px;
            max-width: 150px;
            flex-shrink: 0;
        }

        .student-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 5px 10px;
            border-radius: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            width: 100%;
        }

        /* ===== SCORE CONTROLS (plus/min + getal) ===== */
        .score-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .btn-score {
            width: 33px;
            height: 33px;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            line-height: 1;
            flex-shrink: 0;
        }

        .btn-score:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
        }

        .btn-score:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
            cursor: not-allowed;
        }

        .btn-plus {
            background: #2ecc71;
        }
        .btn-plus:hover:not(:disabled) {
            background: #27ae60;
        }

        .btn-minus {
            background: #e74c3c;
        }
        .btn-minus:hover:not(:disabled) {
            background: #c0392b;
        }

        .score-number {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c3e50;
            min-width: 30px;
            text-align: center;
            background: #f8f5f0;
            padding: 3px 5px;
            border-radius: 15px;
            border: 2px solid #ddd6cc;
            flex-shrink: 0;
        }

        /* ===== GRAFIEK / BALKWEG (50% kleiner) ===== */
        .graph-wrapper {
            flex: 1;
            min-width: 100px;
            position: relative;
            height: 28px;
            background: #ecf0f1;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.10);
            border: 2px solid #d5cdc0;
            overflow: visible;
        }

        .graph-bar-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
        }

        .graph-bar {
            height: 100%;
            width: 50%; /* start op 0 = midden */
            border-radius: 20px;
            transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 1px 6px rgba(52, 152, 219, 0.3);
            position: relative;
        }

        /* Kleurverloop op de balk */
        .graph-bar.positive {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            box-shadow: 0 1px 6px rgba(46, 204, 113, 0.4);
        }

        .graph-bar.negative {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            box-shadow: 0 1px 6px rgba(231, 76, 60, 0.4);
        }

        .graph-bar.zero {
            background: #95a5a6;
            box-shadow: 0 1px 6px rgba(149, 165, 166, 0.3);
        }

        /* Labels -20 en +20 op de uiteinden */
        .graph-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            font-weight: 600;
            color: #7f8c8d;
            padding: 0 5px;
            margin-top: -12px;
        }

        /* ===== LAADSTATUS ===== */
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #5d6d7e;
            padding: 20px;
            background: #ffffffcc;
            border-radius: 20px;
        }

        .error-message {
            text-align: center;
            font-size: 0.9rem;
            color: #e67e22;
            padding: 12px;
            background: #fef9e7;
            border-radius: 20px;
            border: 2px solid #f39c12;
            margin-bottom: 10px;
        }

        .error-message .fallback-note {
            font-size: 0.85rem;
            color: #2c3e50;
            margin-top: 5px;
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .student-name-wrapper {
                min-width: 120px;
                max-width: 120px;
            }
            .student-name {
                font-size: 1rem;
                padding: 4px 8px;
            }
        }

        @media (max-width: 1000px) {
            .student-name-wrapper {
                min-width: 100px;
                max-width: 100px;
            }
            .student-name {
                font-size: 0.9rem;
                padding: 3px 7px;
            }
            .btn-score {
                width: 28px;
                height: 28px;
                font-size: 1.1rem;
            }
            .score-number {
                font-size: 0.95rem;
                min-width: 25px;
            }
            .graph-wrapper {
                height: 24px;
                min-width: 80px;
            }
        }

        @media (max-width: 700px) {
            .container {
                padding: 12px 10px 20px;
            }
            .student-card {
                padding: 8px 10px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .student-name-wrapper {
                min-width: 100%;
                max-width: 100%;
                flex: 1 1 100%;
            }
            .student-name {
                font-size: 1rem;
                display: inline-block;
                width: auto;
                padding: 3px 12px;
            }
            .graph-wrapper {
                min-width: 80px;
                height: 22px;
                flex: 1 1 100%;
                order: 10;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== LIJST MET LEERLINGEN ===== -->
    <div id="studentsContainer" class="students-list">
        <div class="loading">📂 Leerlingen laden...</div>
    </div>
</div>

<script>
    // ============================================================
    //  FALLBACK-LEERLINGEN (als Firebase niet beschikbaar is)
    //  Pas deze namen aan naar wens.
    // ============================================================
    const FALLBACK_STUDENTS = [
        "Jan-Willemke",
        "Mohammed",
        "Tineke",
        "Charmaine"
    ];
    // ============================================================

    // ---------- Globale variabele ----------
    let students = [];

    // ---------- DOM referenties ----------
    const container = document.getElementById('studentsContainer');

    // ---------- Hulpfunctie: unieke ID ----------
    let nextId = 1;
    function generateId() {
        return nextId++;
    }

    // ---------- Score begrenzing ----------
    const MIN_SCORE = -20;
    const MAX_SCORE = 20;

    // ---------- Kleur voor de balk op basis van score ----------
    function getBarClass(score) {
        if (score > 0) return 'positive';
        if (score < 0) return 'negative';
        return 'zero';
    }

    // ---------- Berekening breedte in % (0 = midden, -20 = 0%, +20 = 100%) ----------
    function scoreToPercent(score) {
        return ((score - MIN_SCORE) / (MAX_SCORE - MIN_SCORE)) * 100;
    }

    // ---------- Een studentkaart renderen ----------
    function renderStudent(student) {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.dataset.id = student.id;

        // ===== NAAM (vaste breedte 150px) =====
        const nameWrapper = document.createElement('div');
        nameWrapper.className = 'student-name-wrapper';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'student-name';
        nameSpan.textContent = student.name;
        nameSpan.title = student.name;

        nameWrapper.appendChild(nameSpan);

        // ===== SCORE CONTROLS =====
        const controls = document.createElement('div');
        controls.className = 'score-controls';

        const minusBtn = document.createElement('button');
        minusBtn.className = 'btn-score btn-minus';
        minusBtn.textContent = '−';
        minusBtn.disabled = (student.score <= MIN_SCORE);

        const scoreSpan = document.createElement('span');
        scoreSpan.className = 'score-number';
        scoreSpan.textContent = student.score;

        const plusBtn = document.createElement('button');
        plusBtn.className = 'btn-score btn-plus';
        plusBtn.textContent = '+';
        plusBtn.disabled = (student.score >= MAX_SCORE);

        controls.appendChild(minusBtn);
        controls.appendChild(scoreSpan);
        controls.appendChild(plusBtn);

        // ===== GRAFIEK =====
        const graphWrapper = document.createElement('div');
        graphWrapper.className = 'graph-wrapper';

        const barContainer = document.createElement('div');
        barContainer.className = 'graph-bar-container';

        const bar = document.createElement('div');
        bar.className = `graph-bar ${getBarClass(student.score)}`;
        bar.style.width = scoreToPercent(student.score) + '%';

        barContainer.appendChild(bar);
        graphWrapper.appendChild(barContainer);

        // Labels -20 en +20
        const labels = document.createElement('div');
        labels.className = 'graph-labels';
        const leftLabel = document.createElement('span');
        leftLabel.textContent = '-20';
        const rightLabel = document.createElement('span');
        rightLabel.textContent = '+20';
        labels.appendChild(leftLabel);
        labels.appendChild(rightLabel);
        graphWrapper.appendChild(labels);

        // Alles in de kaart stoppen
        card.appendChild(nameWrapper);
        card.appendChild(controls);
        card.appendChild(graphWrapper);

        // ---- Event listeners voor + en - ----
        minusBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (student.score > MIN_SCORE) {
                student.score--;
                updateStudentCard(card, student);
            }
        });

        plusBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (student.score < MAX_SCORE) {
                student.score++;
                updateStudentCard(card, student);
            }
        });

        return card;
    }

    // ---------- Een bestaande kaart bijwerken ----------
    function updateStudentCard(card, student) {
        const scoreSpan = card.querySelector('.score-number');
        if (scoreSpan) scoreSpan.textContent = student.score;

        const minusBtn = card.querySelector('.btn-minus');
        const plusBtn = card.querySelector('.btn-plus');
        if (minusBtn) minusBtn.disabled = (student.score <= MIN_SCORE);
        if (plusBtn) plusBtn.disabled = (student.score >= MAX_SCORE);

        const bar = card.querySelector('.graph-bar');
        if (bar) {
            bar.style.width = scoreToPercent(student.score) + '%';
            bar.className = `graph-bar ${getBarClass(student.score)}`;
        }
    }

    // ---------- Volledige lijst renderen ----------
    function renderAllStudents() {
        container.innerHTML = '';
        if (students.length === 0) {
            container.innerHTML = '<div class="loading">Nog geen leerlingen</div>';
            return;
        }
        students.forEach(student => {
            const card = renderStudent(student);
            container.appendChild(card);
        });
    }

    // ---------- Leerlingen laden uit Firebase met fallback ----------
    async function loadStudentsFromJson() {
        try {
            const snapshot = await db.collection('contestants').limit(1).get();

            if (snapshot.empty) {
                throw new Error('Geen document gevonden in de "contestants" collectie');
            }

            const data = snapshot.docs[0].data();

            if (!data.leerlingen || !Array.isArray(data.leerlingen)) {
                throw new Error('Document bevat geen "leerlingen" array');
            }

            students = data.leerlingen.map(leerling => ({
                id: generateId(),
                name: leerling.naam || 'Onbekend',
                score: 0
            }));

            if (data.spellen && Array.isArray(data.spellen)) {
                console.log('📚 Spellen beschikbaar:', data.spellen.map(s => s.naam).join(', '));
            }

            renderAllStudents();
            console.log(`✅ ${students.length} leerlingen geladen uit Firebase (contestants)`);

        } catch (error) {
            console.warn('⚠️ Gebruik fallback-leerlingen:', error.message);

            students = FALLBACK_STUDENTS.map(name => ({
                id: generateId(),
                name: name,
                score: 0
            }));

            renderAllStudents();

            const fallbackMsg = document.createElement('div');
            fallbackMsg.className = 'error-message';
            fallbackMsg.innerHTML = `
                ℹ️ <strong>Firebase (contestants)</strong> niet beschikbaar.<br>
                <span class="fallback-note">
                    Gebruik standaardlijst: ${FALLBACK_STUDENTS.join(', ')}
                </span>
            `;
            container.prepend(fallbackMsg);

            console.log(`📋 ${students.length} fallback-leerlingen geladen`);
        }
    }

    // ---------- Start de applicatie ----------
    loadStudentsFromJson();

    console.log('🚀 Scorebord gestart');
</script>

</body>
</html>
